name: 功能建议
description: 建议新的能力、Provider 支持或体验改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: use-case
    attributes:
      label: 使用场景
      description: 说明需要解决的问题，以及现有命令为何不足。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明预期接口、行为和兼容性影响。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 列出已考虑的替代方式或临时解决办法。
