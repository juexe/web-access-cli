name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: 检出发布标签
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: 安装 pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.16.0
      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 运行完整检查
        run: pnpm check
      - name: 确认生成 Schema 已提交
        run: git diff --exit-code -- schemas/
      - name: 构建发布包
        run: pnpm pack:check
      - name: 验证发布上下文
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor HEAD origin/main

          package_name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$version"
          test "$(node dist/cli.js --version)" = "$version"

          if [ "$IS_PRERELEASE" = "true" ]; then
            case "$version" in
              *-*) dist_tag=next ;;
              *) echo "GitHub prerelease 必须使用 SemVer prerelease 版本" >&2; exit 1 ;;
            esac
          else
            case "$version" in
              *-*) echo "正式 GitHub Release 不能发布 prerelease 版本" >&2; exit 1 ;;
              *) dist_tag=latest ;;
            esac
          fi

          archive=".artifacts/$package_name-$version.tgz"
          test -f "$archive"
          registry_url="https://registry.npmjs.org/$package_name/$version"
          if ! status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 "$registry_url")"; then
            echo "无法查询 npm Registry，拒绝发布" >&2
            exit 1
          fi
          case "$status" in
            200)
              echo "$package_name@$version 已存在，拒绝重复发布" >&2
              exit 1
              ;;
            404) ;;
            *)
              echo "npm Registry 返回 HTTP $status，拒绝发布" >&2
              exit 1
              ;;
          esac

          {
            echo "archive=$archive"
            echo "dist_tag=$dist_tag"
            echo "package_name=$package_name"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: 安装发布版 npm CLI
        run: npm install --global npm@12.0.2
      - name: 发布到 npm
        run: npm publish "${{ steps.release.outputs.archive }}" --access public --tag "${{ steps.release.outputs.dist_tag }}"
      - name: 验证 npm 注册表
        shell: bash
        run: |
          registry_url="https://registry.npmjs.org/${{ steps.release.outputs.package_name }}/${{ steps.release.outputs.version }}"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          for _ in {1..60}; do
            if status="$(curl --silent --output "$response_file" --write-out '%{http_code}' --max-time 20 "$registry_url")"; then
              case "$status" in
                200)
                  if node -e 'const fs = require("node:fs"); const data = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.exit(data.version === process.argv[2] ? 0 : 1)' "$response_file" '${{ steps.release.outputs.version }}'; then
                    exit 0
                  fi
                  echo "npm Registry 返回了不匹配的版本元数据" >&2
                  exit 1
                  ;;
                404|429|5??) ;;
                *)
                  echo "npm Registry 返回 HTTP $status" >&2
                  exit 1
                  ;;
              esac
            fi
            sleep 10
          done
          echo "npm Registry 未在 10 分钟内返回已发布版本；重试工作流前必须先人工核验" >&2
          exit 1
