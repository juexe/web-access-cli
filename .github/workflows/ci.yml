name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.19.0
          - os: ubuntu-latest
            node: 24.x
          - os: windows-latest
            node: 22.19.0
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.16.0
      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 运行完整检查
        run: pnpm check
      - name: 确认生成 Schema 已提交
        run: git diff --exit-code -- schemas/

  package:
    name: Package
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.16.0
      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 审计生产依赖
        run: pnpm audit --prod --audit-level=high
      - name: 构建并打包
        run: pnpm pack:check
      - name: 检查发布清单
        shell: bash
        run: |
          archive="$(find .artifacts -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$archive"
          contents="$(tar -tf "$archive")"
          printf '%s\n' "$contents"
          while IFS= read -r entry; do
            case "$entry" in
              package/dist/*|package/schemas/*|package/LICENSE|package/package.json|package/README.md|package/README_CN.md|package/THIRD_PARTY_NOTICES.md) ;;
              *) printf 'Unexpected package entry: %s\n' "$entry" >&2; exit 1 ;;
            esac
          done <<< "$contents"
          for required in package/dist/cli.js package/schemas/config.schema.json package/schemas/extractRequest.schema.json package/schemas/output.schema.json package/schemas/searchRequest.schema.json package/LICENSE package/package.json package/README.md package/README_CN.md package/THIRD_PARTY_NOTICES.md; do
            grep -Fxq "$required" <<< "$contents"
          done
      - name: 验证打包后的 CLI
        shell: bash
        run: |
          archive="$(find .artifacts -maxdepth 1 -name '*.tgz' -print -quit)"
          install_dir="$(mktemp -d)"
          trap 'rm -rf "$install_dir"' EXIT
          pnpm --dir "$install_dir" add "$PWD/$archive" --ignore-scripts
          cli="$install_dir/node_modules/.bin/web-access"
          expected_version="$(node -p "require('./package.json').version")"
          test "$("$cli" --version)" = "$expected_version"

          set +e
          stdout="$("$cli" extract 'ftp://example.com' 2>"$install_dir/stderr.txt")"
          status=$?
          set -e
          test "$status" -eq 2
          test ! -s "$install_dir/stderr.txt"
          node -e 'const value = JSON.parse(process.argv[1]); if (value.ok !== false || value.error?.code !== "invalid_input") process.exit(1)' "$stdout"
